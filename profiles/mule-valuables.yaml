# Consolidation profile for /ub ig — the high-value, bankable items you want to
# funnel from farmers onto a single banker/mule. Deliberately excludes currencies
# you spend (MMDs, Serpent Coins) and the Festivus Present (open it, don't mule it).

out: MuleValuables.utl
itemgiver: true   # also deploy to UtilityBelt's itemgiver folder for `/ub ig`

rules:
  - name: "Ancient Empyrean Trinkets"
    action: keep
    when:
      name_matches: "Ancient Empyrean Trinket"

  - name: "Ancient Falatacot Trinkets"
    action: keep
    when:
      name_matches: "Ancient Falatacot Trinket"

  - name: "Legendary Keys (all tiers)"
    action: keep
    when:
      name_matches: "Legendary Key|Durable Legendary"

  - name: "Mythic Keys"
    action: keep
    when:
      name_matches: "Mythic Key"

  - name: "Medallions of the Coven"
    action: keep
    when:
      name_matches: "Medallion of the Coven"

  # Bankable mob-loot currency (Bak'tshay-tier drops) -> Relic Imbue Gems.
  - name: "Resplendent Coins"
    action: keep
    when:
      name_matches: "Resplendent Coin"

  # Liquid cash to consolidate onto the banker (confirmed held by all farmers).
  - name: "Trade & Promissory Notes"
    action: keep
    when:
      name_matches: "Trade Note|Promissory Note"

  # Coalesced Aetheria: valuable raw drop to bank (mirrors the hunting profile).
  # Scoped to "Coalesced" so we don't mule slotted/in-use Aetheria or Mana Stones.
  - name: "Coalesced Aetheria"
    action: keep
    when:
      name_matches: "Coalesced Aetheria"

  # ---------- Collectibles to consolidate on Deus (mirrors hunting profile) ----------
  # "Pack [A-Z]" = novelty pack pets/dolls only; never real backpacks (class 10).
  - name: "Pack pets / dolls (novelty)"
    action: keep
    when:
      name_matches: "Pack [A-Z]"

  - name: "Golden Gromnies"
    action: keep
    when:
      name_matches: "Golden Gromnie"

  - name: "Idol Gems"
    action: keep
    when:
      name_matches: "Idol Gem"

  - name: "Lucky Letters"
    action: keep
    when:
      name_matches: "Lucky.*Letter"

  - name: "Writs of Refuge"
    action: keep
    when:
      name_matches: "Writ of Refuge"

  # (pending) Unvalidated spelling — none held at scan time. Harmless until it hits.
  - name: "Dread Mattekar Paws (pending)"
    action: keep
    when:
      name_matches: "Dread Mattekar Paw"
