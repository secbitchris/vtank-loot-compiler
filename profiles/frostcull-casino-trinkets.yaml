# Frostcull — Olthoi casino-trinket farming.
# Keeps ONLY "Ancient Empyrean Trinket" (turn in to the Collector at the Shoushi
# Casino). Everything else is left on the corpse. There is exactly one keep rule,
# so VTank loots nothing but the trinkets.
#
# Compile:  python utl_compile.py profiles/frostcull-casino-trinkets.yaml -o AncientTrinkets.utl
# Then drop AncientTrinkets.utl in your Virindi Tank folder and pick it on the Loot tab.

rules:
  - name: "Ancient Empyrean Trinkets"
    action: keep
    when:
      name_matches: "Ancient Empyrean Trinket"
